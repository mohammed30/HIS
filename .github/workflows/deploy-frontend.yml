name: Deploy Frontend

on:
  push:
    branches:
      - main
      - EditDesign
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Deploy Frontend to Azure
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: src/angular/package-lock.json
        
    - name: Install Dependencies
      run: npm ci
      working-directory: src/angular
      
    - name: Build
      run: npm run build:prod
      working-directory: src/angular

    - name: Consolidate Build Artifacts
      run: |
        # Move stray files from dist/HIS to dist/HIS/browser
        cp src/angular/dist/HIS/dynamic-env.json src/angular/dist/HIS/browser/ || true
        cp src/angular/dist/HIS/web.config src/angular/dist/HIS/browser/ || true
        # Using -r for directories like media
        cp -r src/angular/dist/HIS/media src/angular/dist/HIS/browser/ || true
      shell: bash
      
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'asiahospitalfront'
        package: src/angular/dist/HIS/browser
        publish-profile: ${{ secrets.AZURE_FRONTEND_PUBLISH_PROFILE }}
