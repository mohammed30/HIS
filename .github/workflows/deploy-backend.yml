name: Deploy Backend

on:
  push:
    branches:
      - main
      - EditDesign
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Deploy Backend to Azure
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Restore dependencies
      run: dotnet restore src/src/HIS.HttpApi.Host/HIS.HttpApi.Host.csproj
      
    - name: Build
      run: dotnet build src/src/HIS.HttpApi.Host/HIS.HttpApi.Host.csproj --no-restore -c Release
      
    - name: Publish
      run: dotnet publish src/src/HIS.HttpApi.Host/HIS.HttpApi.Host.csproj -c Release -o "${{env.DOTNET_ROOT}}/myapp"

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'asiahospitalback-ffdkapgqauaherbd'
        package: ${{env.DOTNET_ROOT}}/myapp
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
