    <text x="107" y="169" text-anchor="middle" direction="rtl" class="body">اسم عربي وكود تلقائي</text>
    <text x="107" y="201" text-anchor="middle" direction="rtl" class="body">تحديد الموقع والتحويلة</text>
    <text x="107" y="233" text-anchor="middle" direction="rtl" class="body">تفعيل القسم IsActive</text>
    <text x="107" y="265" text-anchor="middle" direction="rtl" class="body">تحديده كقسم طبي IsMedical</text>
  </g>

  <g transform="translate(273,162)" style="color:#128044">
    <rect width="224" height="296" class="card" stroke="#128044"/>
    <circle cx="204" cy="23" r="17" fill="#15924e"/><text x="204" y="31" text-anchor="middle" fill="#fff" font-size="22" font-weight="900">2</text>
    <g transform="translate(72,22)">
      <circle cx="22" cy="31" r="16" class="iconFill" stroke="#128044" stroke-width="4"/>
      <path d="M8 72 C12 51 55 51 59 72" class="iconStroke"/>
      <rect x="70" y="20" width="36" height="54" rx="6" class="iconFill"/>
      <rect x="70" y="20" width="36" height="54" rx="6" class="iconStroke"/>
      <path d="M80 36 H96 M80 51 H96" class="iconStroke"/>
    </g>
    <text x="112" y="132" text-anchor="middle" direction="rtl" class="cardTitle" fill="#128044">مراجعة القسم الطبي</text>
    <text x="112" y="169" text-anchor="middle" direction="rtl" class="body">القسم يظهر في lookup الطبي</text>
    <text x="112" y="201" text-anchor="middle" direction="rtl" class="body">مطلوب للعيادة والطبيب</text>
    <text x="112" y="233" text-anchor="middle" direction="rtl" class="body">اختياري: مركز تكلفة</text>
    <text x="112" y="265" text-anchor="middle" direction="rtl" class="body">اختياري: حساب فرعي تلقائي</text>
  </g>

  <g transform="translate(535,162)" style="color:#048296">
    <rect width="210" height="296" class="card" stroke="#048296"/>
    <circle cx="190" cy="23" r="17" fill="#0a8ca0"/><text x="190" y="31" text-anchor="middle" fill="#fff" font-size="22" font-weight="900">3</text>
    <g transform="translate(70,23)">
      <rect x="14" y="30" width="76" height="52" rx="8" class="iconFill"/>
      <rect x="14" y="30" width="76" height="52" rx="8" class="iconStroke"/>
      <path d="M20 30 L52 6 L84 30 M52 82 V54 M32 82 V60 M72 82 V60" class="iconStroke"/>
    </g>
    <text x="105" y="132" text-anchor="middle" direction="rtl" class="cardTitle" fill="#048296">إضافة العيادة</text>
    <text x="105" y="169" text-anchor="middle" direction="rtl" class="body">اختيار القسم الطبي</text>
    <text x="105" y="201" text-anchor="middle" direction="rtl" class="body">اسم وكود تلقائي CLN</text>
    <text x="105" y="233" text-anchor="middle" direction="rtl" class="body">غرفة، موقع، تحويلة</text>
    <text x="105" y="265" text-anchor="middle" direction="rtl" class="body">مدة الموعد وسعر الكشف</text>
  </g>

  <g transform="translate(781,162)" style="color:#7130a8">
    <rect width="215" height="296" class="card" stroke="#7130a8"/>
    <circle cx="195" cy="23" r="17" fill="#7130a8"/><text x="195" y="31" text-anchor="middle" fill="#fff" font-size="22" font-weight="900">4</text>
    <g transform="translate(74,20)">
      <circle cx="43" cy="24" r="18" fill="#7130a8" opacity=".13" stroke="#7130a8" stroke-width="4"/>
