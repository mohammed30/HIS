      <rect x="12" y="0" width="62" height="80" rx="5" class="iconStroke"/>
      <path d="M27 21 H60 M27 40 H60 M27 58 H47" class="iconStroke"/>
      <circle cx="86" cy="66" r="18" fill="#fff" stroke="#126bc4" stroke-width="4"/>
      <path d="M77 66 L84 73 L96 57" stroke="#126bc4" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="134" y="126" text-anchor="middle" direction="rtl" class="cardTitle" fill="#126bc4">جاهز للحجز</text>
    <text x="134" y="166" text-anchor="middle" direction="rtl" class="body">القسم يظهر في التعريفات</text>
    <text x="134" y="198" text-anchor="middle" direction="rtl" class="body">العيادة مربوطة بالقسم</text>
    <text x="134" y="230" text-anchor="middle" direction="rtl" class="body">الطبيب يظهر في lookup</text>
    <text x="134" y="262" text-anchor="middle" direction="rtl" class="body">الحصص تظهر في جدول الطبيب</text>
  </g>

  <path d="M1213 675 H1146" class="arrow"/>
  <path d="M876 675 H780 C720 675 705 623 705 560" class="arrow"/>

  <!-- Return box -->
  <g transform="translate(568,532)">
    <rect width="198" height="237" rx="12" fill="#fffdfd" stroke="#e11d1d" stroke-width="2" stroke-dasharray="7 6"/>
    <path d="M84 42 C111 20 154 44 142 82 M142 82 L141 59 M142 82 L119 80" fill="none" stroke="#e03a2e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M113 116 C86 138 43 114 55 76 M55 76 L56 99 M55 76 L78 78" fill="none" stroke="#e03a2e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="99" y="151" text-anchor="middle" direction="rtl" class="noteTitle">عودة للتعديل</text>
    <text x="99" y="178" text-anchor="middle" direction="rtl" class="noteText">في حال نقص بيانات</text>
    <text x="99" y="205" text-anchor="middle" direction="rtl" class="noteText">يتم تعديل القسم أو العيادة</text>
    <text x="99" y="232" text-anchor="middle" direction="rtl" class="noteText">أو الطبيب أو الحصة</text>
  </g>
  <path d="M668 532 C668 502 390 510 382 463" class="return"/>
  <path d="M668 532 C668 502 640 510 640 463" class="return"/>
  <path d="M668 532 C668 502 1138 510 1139 463" class="return"/>
  <path d="M668 769 C668 850 1285 838 1288 817" class="return"/>

  <!-- Summary -->
  <g transform="translate(23,615)">
    <rect width="505" height="216" rx="10" fill="#fff" stroke="#46699a" stroke-width="2" filter="url(#softShadow)"/>
    <circle cx="55" cy="56" r="39" fill="#fff" stroke="#0d55b3" stroke-width="2.5"/>
    <rect x="36" y="36" width="42" height="42" rx="8" fill="#dfeeff" stroke="#0d55b3" stroke-width="3"/>
    <path d="M48 56 H66 M57 47 V65" stroke="#0d55b3" stroke-width="4" stroke-linecap="round"/>
    <path d="M72 72 L82 82 L99 58" stroke="#15924e" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="112" y="25" width="397" height="40" rx="11" fill="url(#blueBadge)"/>
    <text x="310" y="52" text-anchor="middle" direction="rtl" class="summaryTitle">ملخص مراجعة الكود</text>
    <text x="290" y="98" text-anchor="middle" direction="rtl" class="body">القسم يجب أن يكون نشطًا وطبيًا ليظهر في اختيار العيادة والطبيب.</text>
    <text x="290" y="130" text-anchor="middle" direction="rtl" class="body">العيادة ترتبط بقسم واحد وتظهر للأطباء عبر GetByDepartment.</text>
    <text x="290" y="162" text-anchor="middle" direction="rtl" class="body">الطبيب يحتاج تخصصًا وقسمًا، والعيادة اختيارية.</text>
    <text x="290" y="194" text-anchor="middle" direction="rtl" class="body">حصة الطبيب لنفس الطبيب ونفس اليوم يتم تحديثها بدل إنشاء مكرر.</text>
  </g>

  <!-- Legend -->
  <g transform="translate(1297,847)">
    <rect width="207" height="146" rx="10" fill="#fff" stroke="#46699a" stroke-width="1.6" filter="url(#softShadow)"/>
    <text x="103" y="28" text-anchor="middle" direction="rtl" class="footerTitle">مفتاح الرموز</text>
    <path d="M25 55 H67" class="arrow"/>
    <text x="145" y="62" text-anchor="middle" direction="rtl" class="body">تدفق العملية</text>
    <path d="M25 89 H67" class="return"/>
    <text x="146" y="96" text-anchor="middle" direction="rtl" class="body">عودة للتعديل</text>
    <text x="44" y="126" class="check">✓</text>
    <text x="145" y="127" text-anchor="middle" direction="rtl" class="body">مراجعة واعتماد</text>
