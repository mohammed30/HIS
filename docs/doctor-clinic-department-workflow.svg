      <path d="M18 80 C23 55 69 55 74 80" class="iconStroke"/>
      <path d="M27 34 H65" class="iconStroke"/>
      <rect x="79" y="51" width="34" height="34" rx="5" fill="#e08800" opacity=".12" stroke="#e08800" stroke-width="4"/>
      <path d="M88 68 H104 M96 60 V76" class="iconStroke"/>
