    <text x="112" y="201" text-anchor="middle" direction="rtl" class="body">اختيار يوم أو عدة أيام</text>
    <text x="112" y="233" text-anchor="middle" direction="rtl" class="body">وقت بداية ونهاية</text>
    <text x="112" y="265" text-anchor="middle" direction="rtl" class="body">مدة الحجز 5 إلى 120 دقيقة</text>
  </g>

