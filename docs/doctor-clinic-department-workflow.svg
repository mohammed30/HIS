    <text x="180" y="40" text-anchor="middle" direction="rtl" class="badgeText">إدارة التعريفات الطبية</text>
    <text x="180" y="63" text-anchor="middle" direction="rtl" class="badgeSub">الأقسام والعيادات والأطباء</text>
  </g>

  <text x="768" y="70" text-anchor="middle" direction="rtl" class="title">ورك فلو إضافة قسم وعيادة وطبيب وحصة الطبيب</text>
  <text x="768" y="108" text-anchor="middle" direction="rtl" class="subtitle">من تعريف القسم الطبي حتى ظهور الطبيب في جداول الحجز والمواعيد</text>

