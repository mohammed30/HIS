    <text x="106" y="201" text-anchor="middle" direction="rtl" class="body">اختيار القسم الطبي</text>
    <text x="106" y="233" text-anchor="middle" direction="rtl" class="body">اختيار العيادة اختياري</text>
    <text x="106" y="265" text-anchor="middle" direction="rtl" class="body">أسعار الكشف ومدة الموعد</text>
  </g>

