    <circle cx="205" cy="23" r="17" fill="#0a71bf"/><text x="205" y="31" text-anchor="middle" fill="#fff" font-size="22" font-weight="900">6</text>
    <g transform="translate(78,22)">
      <rect x="12" y="12" width="76" height="70" rx="8" class="iconFill"/>
