    <text x="146" y="166" text-anchor="middle" direction="rtl" class="body">تأكيد الطبيب والقسم</text>
    <text x="146" y="198" text-anchor="middle" direction="rtl" class="body">تأكيد العيادة المختارة</text>
    <text x="146" y="230" text-anchor="middle" direction="rtl" class="body">تأكيد اليوم والوقت</text>
    <text x="146" y="262" text-anchor="middle" direction="rtl" class="body">مراجعة عدم تعارض الحصص</text>
  </g>

  <g transform="translate(876,530)" style="color:#126bc4">
    <rect width="267" height="285" class="card" stroke="#126bc4"/>
    <circle cx="247" cy="20" r="17" fill="#126bc4"/><text x="247" y="28" text-anchor="middle" fill="#fff" font-size="22" font-weight="900">8</text>
    <g transform="translate(87,18)">
