    <rect width="212" height="296" class="card" stroke="#e08800"/>
    <circle cx="192" cy="23" r="17" fill="#f0a000"/><text x="192" y="31" text-anchor="middle" fill="#fff" font-size="22" font-weight="900">5</text>
