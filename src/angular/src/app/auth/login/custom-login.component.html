<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header text-center mb-4">
      <div class="logo-container mb-3 text-center">
        <!-- Hospital Logo -->
        <img src="assets/images/logo/Dark.png" alt="مستشفى آسيا" style="max-height: 80px; width: auto;" />
      </div>
      <h3 class="fw-bold">مستشفى آسيا</h3>
      <p class="text-muted">Asia Hospital</p>
    </div>

    <!-- Tenant Switch Removed -->

    <div class="login-body">
      <h4 class="mb-3 text-center">دخول</h4>
      <p class="text-center text-muted mb-4">هل أنت مستخدم جديد؟ <a href="#" class="text-decoration-none">تسجيل</a></p>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label">اسم المستخدم أو البريد الإلكتروني</label>
          <input type="text" class="form-control" formControlName="username" 
                 [class.is-invalid]="form.get('username').invalid && form.get('username').touched">
        </div>

        <div class="mb-3">
          <label class="form-label">كلمة المرور</label>
          <div class="input-group">
            <button class="btn btn-outline-secondary" type="button" (click)="togglePasswordVisibility()">
              <i class="fas" [class.fa-eye]="!isPasswordVisible" [class.fa-eye-slash]="isPasswordVisible"></i>
            </button>
            <input [type]="isPasswordVisible ? 'text' : 'password'" class="form-control" formControlName="password"
                   [class.is-invalid]="form.get('password').invalid && form.get('password').touched">
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="rememberMe" formControlName="rememberMe">
            <label class="form-check-label" for="rememberMe">تذكرني</label>
          </div>
          <a href="#" class="text-decoration-none small">نسيت كلمة السر؟</a>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2" [disabled]="form.invalid || inProgress">
          <span *ngIf="inProgress" class="spinner-border spinner-border-sm me-2"></span>
          دخول
        </button>
      </form>
    </div>

    <!-- Language Switch Footer -->
    <div class="login-footer mt-4 pt-3 border-top">
      <div class="d-flex justify-content-center align-items-center gap-2">
        <i class="fas fa-globe text-muted"></i>
        <select class="form-select form-select-sm w-auto border-0 bg-transparent text-muted fw-bold" 
                [ngModel]="currentLang" (ngModelChange)="changeLang($event)">
          <option *ngFor="let lang of languages" [value]="lang.cultureName">
            {{ lang.displayName }}
          </option>
        </select>
      </div>
    </div>
  </div>
</div>
