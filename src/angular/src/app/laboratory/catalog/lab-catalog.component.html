<div class="card">
    <div class="card-header">
        <div class="row">
            <div class="col col-md-6">
                <h5 class="card-title">{{ '::Menu:LabCatalog' | abpLocalization }}</h5>
            </div>
            <div class="text-end col col-md-6">
                <div class="text-lg-end pt-2">
                    <button id="create" class="btn btn-primary" type="button" (click)="createTest()">
                        <i class="fa fa-plus me-1"></i>
                        <span>{{ '::NewTest' | abpLocalization }}</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="card-body">
        <ngx-datatable [rows]="data.items" [count]="data.totalCount" [list]="list" default>
            <ngx-datatable-column [name]="'::Code' | abpLocalization" prop="code"></ngx-datatable-column>
            <ngx-datatable-column [name]="'::Name' | abpLocalization" prop="name"></ngx-datatable-column>
            <ngx-datatable-column [name]="'::Price' | abpLocalization" prop="price">
                <ng-template let-row="row" ngx-datatable-cell-template>
                    {{ row.price | currency }}
                </ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column [name]="'::Unit' | abpLocalization" prop="unit"></ngx-datatable-column>
            <ngx-datatable-column [name]="'::Range' | abpLocalization" prop="referenceRange"></ngx-datatable-column>

            <ngx-datatable-column [name]="'::Actions' | abpLocalization" [maxWidth]="150" [sortable]="false">
                <ng-template let-row="row" ngx-datatable-cell-template>
                    <div ngbDropdown container="body" class="d-inline-block">
                        <button class="btn btn-primary btn-sm dropdown-toggle" data-toggle="dropdown"
                            aria-haspopup="true" ngbDropdownToggle>
                            <i class="fa fa-cog me-1"></i>{{ '::Actions' | abpLocalization }}
                        </button>
                        <div ngbDropdownMenu>
                            <button ngbDropdownItem (click)="editTest(row.id)">
                                {{ '::Edit' | abpLocalization }}
                            </button>
                            <button ngbDropdownItem (click)="deleteTest(row.id)">
                                {{ '::Delete' | abpLocalization }}
                            </button>
                        </div>
                    </div>
                </ng-template>
            </ngx-datatable-column>
        </ngx-datatable>
    </div>
</div>

<abp-modal [(visible)]="isModalOpen">
    <ng-template #abpHeader>
        <h3>{{ (selectedId ? '::Edit' : '::NewTest') | abpLocalization }}</h3>
    </ng-template>

    <ng-template #abpBody>
        <!-- Code is auto-generated, show only when editing -->
        <div class="form-group mb-3" *ngIf="selectedId">
            <label class="form-label">{{ '::Code' | abpLocalization }}</label>
            <input class="form-control" [(ngModel)]="selectedTest.code" readonly disabled>
            <small class="text-muted">{{ '::AutoGeneratedCode' | abpLocalization }}</small>
        </div>
        <div class="form-group mb-3">
            <label class="form-label">{{ '::Name' | abpLocalization }} <span class="text-danger">*</span></label>
            <input class="form-control" [(ngModel)]="selectedTest.name" required>
        </div>
        <div class="form-group mb-3">
            <label class="form-label">{{ '::Price' | abpLocalization }}</label>
            <input type="number" class="form-control" [(ngModel)]="selectedTest.price" placeholder="0">
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">{{ '::Unit' | abpLocalization }}</label>
                <input class="form-control" [(ngModel)]="selectedTest.unit" placeholder="mg/dL, mmol/L, etc.">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">{{ '::ReferenceRange' | abpLocalization }}</label>
                <input class="form-control" [(ngModel)]="selectedTest.referenceRange" placeholder="70-100">
            </div>
        </div>
        <div class="form-group mb-3">
            <label class="form-label">{{ '::Instructions' | abpLocalization }}</label>
            <textarea class="form-control" [(ngModel)]="selectedTest.instructions" rows="2"
                placeholder="فاطر، صائم، إلخ"></textarea>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="checkbox" [(ngModel)]="selectedTest.isActive">
            <label class="form-check-label">{{ '::Active' | abpLocalization }}</label>
        </div>
    </ng-template>

    <ng-template #abpFooter>
        <button type="button" class="btn btn-secondary" abpClose>
            {{ '::Close' | abpLocalization }}
        </button>
        <button class="btn btn-primary" (click)="save()">
            <i class="fa fa-check me-1"></i>
            {{ '::Save' | abpLocalization }}
        </button>
    </ng-template>
</abp-modal>
