<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col col-md-6">
        <h5 class="card-title">{{ '::Menu:Rooms' | abpLocalization }}</h5>
      </div>
      <div class="col text-end">
        <div class="text-lg-end pt-2">
          <button *abpPermission="'HIS.Inpatient.Rooms.Create'" id="create" class="btn btn-primary" type="button"
            (click)="createRoom()">
            <i class="fa fa-plus me-1"></i>
            <span>{{ '::NewRoom' | abpLocalization }}</span>
          </button>
        </div>
      </div>
    </div>
  </div>
  <div class="card-body">
    <ngx-datatable [rows]="data.items" [count]="data.totalCount" [list]="list" default>
      <ngx-datatable-column [name]="'::Actions' | abpLocalization" [maxWidth]="150" [sortable]="false">
        <ng-template let-row="row" ngx-datatable-cell-template>
          <div class="d-flex gap-2">
            <button *abpPermission="'HIS.Inpatient.Rooms.Edit'" class="btn btn-primary btn-sm"
              (click)="editRoom(row.id)" title="{{ '::Edit' | abpLocalization }}">
              <i class="fa fa-edit"></i>
            </button>
            <button *abpPermission="'HIS.Inpatient.Rooms.Delete'" class="btn btn-danger btn-sm"
              (click)="deleteRoom(row.id)" title="{{ '::Delete' | abpLocalization }}">
              <i class="fa fa-trash"></i>
            </button>
          </div>
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column [name]="'::RoomNumber' | abpLocalization" prop="roomNumber"></ngx-datatable-column>
      <ngx-datatable-column [name]="'::Enum:RoomType' | abpLocalization" prop="type">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ '::Enum:RoomType:' + row.type | abpLocalization }}
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column [name]="'::BedCount' | abpLocalization" prop="bedCount"></ngx-datatable-column>
      <ngx-datatable-column [name]="'::AvailableBeds' | abpLocalization" prop="availableBeds"></ngx-datatable-column>
      <ngx-datatable-column [name]="'::DailyRate' | abpLocalization" prop="dailyRate">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ row.dailyRate | currency }}
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column [name]="'::Enum:RoomStatus' | abpLocalization" prop="status">
        <ng-template let-row="row" ngx-datatable-cell-template>
          <span class="badge" [ngClass]="{
            'bg-success': row.status === 0,
            'bg-danger': row.status === 1,
            'bg-warning': row.status === 2,
            'bg-secondary': row.status === 3
          }">
            {{ '::Enum:RoomStatus:' + row.status | abpLocalization }}
          </span>
        </ng-template>
      </ngx-datatable-column>
    </ngx-datatable>
  </div>
</div>
