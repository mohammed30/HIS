<div class="card">
    <div class="card-header">
        <div class="row">
            <div class="col col-md-6">
                <h5 class="card-title">{{ '::PatientRounds' | abpLocalization }}</h5>
            </div>
            <div class="col text-end">
                <div class="text-lg-end pt-2">
                    <button id="create" class="btn btn-primary" type="button" (click)="createRound()">
                        <i class="fa fa-plus me-1"></i>
                        <span>{{ '::NewRound' | abpLocalization }}</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="card-body">
        <div class="list-group">
            <div *ngFor="let round of rounds.items" class="list-group-item">
                <div class="d-flex w-100 justify-content-between">
                    <h6 class="mb-1">{{ round.nurseId }}</h6> <!-- Should display Nurse Name ideally -->
                    <small>{{ round.creationTime | date:'short' }}</small>
                </div>
                <p class="mb-1">{{ round.note }}</p>
            </div>
            <div *ngIf="rounds.totalCount === 0" class="text-center p-3">
                {{ '::NoRoundsFound' | abpLocalization }}
            </div>
        </div>
    </div>
</div>

<abp-modal [(visible)]="isModalOpen">
    <ng-template #abpHeader>
        <h3>{{ '::NewRound' | abpLocalization }}</h3>
    </ng-template>

    <ng-template #abpBody>
        <form [formGroup]="form" (ngSubmit)="save()">
            <div class="mb-3">
                <label for="note-id" class="form-label">{{ '::Note' | abpLocalization }}</label>
                <textarea id="note-id" class="form-control" formControlName="note" rows="3"></textarea>
            </div>
        </form>
    </ng-template>

    <ng-template #abpFooter>
        <button type="button" class="btn btn-secondary" abpClose>
            {{ 'AbpUi::Cancel' | abpLocalization }}
        </button>
        <button type="button" class="btn btn-primary" (click)="save()" [disabled]="form.invalid">
            <i class="fa fa-check me-1"></i>
            {{ 'AbpUi::Save' | abpLocalization }}
        </button>
    </ng-template>
</abp-modal>
