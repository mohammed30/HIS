<div class="row g-4">
    <!-- Vertical Sidebar -->
    <div class="col-12 col-md-3 border-end pe-md-4">
        <ul ngbNav #nav="ngbNav" [(activeId)]="activeTab" class="nav-pills flex-column modern-vertical-pills gap-2">

            <!-- Care Plans -->
            <li [ngbNavItem]="1">
                <a ngbNavLink class="rounded-3 px-3 py-3 fw-bold w-100 text-start d-flex align-items-center">
                    <div class="nav-icon-box me-3 rounded-circle d-flex align-items-center justify-content-center">
                        <i class="fas fa-clipboard-list"></i>
                    </div>
                    {{ '::CarePlans' | abpLocalization }}
                </a>
                <ng-template ngbNavContent>
                    <app-care-plan [patientId]="patientId"></app-care-plan>
                </ng-template>
            </li>

            <!-- Assessments (Pain & Fall) -->
            <li [ngbNavItem]="2">
                <a ngbNavLink class="rounded-3 px-3 py-3 fw-bold w-100 text-start d-flex align-items-center">
                    <div class="nav-icon-box me-3 rounded-circle d-flex align-items-center justify-content-center">
                        <i class="fas fa-stethoscope"></i>
                    </div>
                    {{ '::Assessments' | abpLocalization }}
                </a>
                <ng-template ngbNavContent>
                    <app-assessments [patientId]="patientId"></app-assessments>
                </ng-template>
            </li>

            <!-- Fluid Balance -->
            <li [ngbNavItem]="3">
                <a ngbNavLink class="rounded-3 px-3 py-3 fw-bold w-100 text-start d-flex align-items-center">
                    <div class="nav-icon-box me-3 rounded-circle d-flex align-items-center justify-content-center">
                        <i class="fas fa-tint"></i>
                    </div>
                    {{ '::FluidBalance' | abpLocalization }}
                </a>
                <ng-template ngbNavContent>
                    <app-fluid-balance [patientId]="patientId"></app-fluid-balance>
                </ng-template>
            </li>

            <!-- Rounds -->
            <li [ngbNavItem]="4">
                <a ngbNavLink class="rounded-3 px-3 py-3 fw-bold w-100 text-start d-flex align-items-center">
                    <div class="nav-icon-box me-3 rounded-circle d-flex align-items-center justify-content-center">
                        <i class="fas fa-user-md"></i>
                    </div>
                    {{ '::Rounds' | abpLocalization }}
                </a>
                <ng-template ngbNavContent>
                    <app-patient-round [patientId]="patientId"></app-patient-round>
                </ng-template>
            </li>

            <!-- Handover -->
            <li [ngbNavItem]="5">
                <a ngbNavLink class="rounded-3 px-3 py-3 fw-bold w-100 text-start d-flex align-items-center">
                    <div class="nav-icon-box me-3 rounded-circle d-flex align-items-center justify-content-center">
                        <i class="fas fa-exchange-alt"></i>
                    </div>
                    {{ '::ShiftHandover' | abpLocalization }}
                </a>
                <ng-template ngbNavContent>
                    <app-shift-handover></app-shift-handover>
                </ng-template>
            </li>

        </ul>
    </div>
    
    <!-- Content Area -->
    <div class="col-12 col-md-9">
        <div [ngbNavOutlet]="nav" class="w-100"></div>
    </div>
</div>
