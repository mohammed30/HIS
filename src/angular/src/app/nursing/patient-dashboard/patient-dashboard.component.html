<div class="container-fluid p-4" style="background-color: #f8fafc; min-height: 100vh;" *ngIf="patient">
    
    <!-- Premium Patient Header Card -->
    <div class="card shadow-sm border-0 mb-4" style="border-radius: 16px; overflow: hidden;">
        <div class="card-body p-4 position-relative">
            <div class="position-absolute top-0 start-0 w-100 h-100 opacity-10" 
                 style="background: linear-gradient(135deg, #3b82f6 0%, transparent 50%); pointer-events: none;"></div>
            
            <div class="d-flex align-items-center gap-4 position-relative z-index-1">
                <div class="bg-primary bg-opacity-10 rounded-circle d-flex align-items-center justify-content-center flex-shrink-0" 
                     style="width: 80px; height: 80px;">
                    <i class="fas fa-user-injured fa-3x text-primary"></i>
                </div>
                <div>
                    <h2 class="card-title fw-bold text-dark mb-2">{{ patient.fullNameAr || patient.fullNameEn }}</h2>
                    <div class="d-flex flex-wrap gap-3 text-muted fw-bold">
                        <span><i class="fas fa-id-card me-1 text-primary"></i> MRN: {{ patient.mrn }}</span>
                        <span><i class="fas fa-calendar-alt me-1 text-primary"></i> {{ '::Age' | abpLocalization }}: {{ patient.age }}</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modern Main Navigation Tabs -->
    <div class="card shadow-sm border-0" style="border-radius: 16px;">
        <div class="card-header bg-white border-bottom-0 pt-3 pb-0 px-4" style="border-radius: 16px 16px 0 0;">
            <ul ngbNav #nav="ngbNav" [(activeId)]="activeTab" class="nav-pills modern-pills gap-2 mb-3">
                <li [ngbNavItem]="1">
                    <a ngbNavLink class="rounded-pill px-4 py-2 fw-bold"><i class="fas fa-heartbeat me-2"></i>{{ '::VitalSigns' | abpLocalization }}</a>
                    <ng-template ngbNavContent>
                        <div class="p-4 bg-white" style="border-radius: 16px;">
                            <app-vital-signs [patientId]="patientId"></app-vital-signs>
                        </div>
                    </ng-template>
                </li>
                <li [ngbNavItem]="2">
                    <a ngbNavLink class="rounded-pill px-4 py-2 fw-bold"><i class="fas fa-pills me-2"></i>{{ '::MedicationAdministrationRecord' | abpLocalization }}</a>
                    <ng-template ngbNavContent>
                        <div class="p-4 bg-white" style="border-radius: 16px;">
                            <app-medication-administration [patientId]="patientId"></app-medication-administration>
                        </div>
                    </ng-template>
                </li>
                <li [ngbNavItem]="3">
                    <a ngbNavLink class="rounded-pill px-4 py-2 fw-bold"><i class="fas fa-notes-medical me-2"></i>{{ '::PatientCare' | abpLocalization }}</a>
                    <ng-template ngbNavContent>
                        <div class="p-4 bg-white" style="border-radius: 16px;">
                            <app-patient-care-dashboard [patientId]="patientId"></app-patient-care-dashboard>
                        </div>
                    </ng-template>
                </li>
            </ul>
        </div>
        
        <div class="card-body p-0 bg-light" style="border-radius: 0 0 16px 16px;">
            <div [ngbNavOutlet]="nav" class="w-100"></div>
        </div>
    </div>

</div>
