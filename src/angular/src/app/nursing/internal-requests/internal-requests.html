<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col col-md-6">
        <h5 class="card-title">طلبات الصرف الداخلي (التمريض)</h5>
      </div>
      <div class="text-end col col-md-6">
        <!-- Add Request Button -->
        <button id="create" class="btn btn-primary" type="button" (click)="createRequest()">
          <i class="fa fa-plus me-1"></i> طلب جديد
        </button>
      </div>
    </div>
  </div>
  <div class="card-body">
    <ngx-datatable [rows]="data.items" [count]="data.totalCount" default>
      <ngx-datatable-column
        [name]="'::Actions' | abpLocalization"
        [maxWidth]="200"
        [sortable]="false"
      >
        <ng-template let-row="row" ngx-datatable-cell-template>
          <div class="d-flex gap-1" *ngIf="row.status === statusEnum.Draft">
            <button
              class="btn btn-primary btn-sm"
              (click)="submit(row.id)"
            >
              <i class="fa fa-paper-plane me-1"></i> إرسال للاعتماد
            </button>
          </div>
          <div class="d-flex gap-1" *ngIf="row.status === statusEnum.Approved">
            <button
              class="btn btn-success btn-sm"
              (click)="receive(row.id)"
            >
              <i class="fa fa-check-circle me-1"></i> تأكيد الاستلام
            </button>
          </div>
        </ng-template>
      </ngx-datatable-column>

      <ngx-datatable-column name="رقم الطلب" prop="requestNumber"></ngx-datatable-column>
      <ngx-datatable-column name="تاريخ الطلب" prop="requestDate">
        <ng-template let-value="value" ngx-datatable-cell-template>
          {{ value | date:'short' }}
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column name="الحالة">
        <ng-template let-row="row" ngx-datatable-cell-template>
          <span class="badge" [ngClass]="{
            'bg-secondary': row.status === statusEnum.Draft,
            'bg-info': row.status === statusEnum.Submitted,
            'bg-success': row.status === statusEnum.Approved,
            'bg-primary': row.status === statusEnum.Received,
            'bg-danger': row.status === statusEnum.Rejected
          }">
            {{ getStatusText(row.status) }}
          </span>
        </ng-template>
      </ngx-datatable-column>
    </ngx-datatable>
  </div>
</div>

<!-- Add Modal -->
<abp-modal [(visible)]="isModalOpen">
  <ng-template #abpHeader>
    <h3>إنشاء طلب جديد</h3>
  </ng-template>

  <ng-template #abpBody>
    <form [formGroup]="form" (ngSubmit)="save()" *ngIf="form">
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">القسم الطالب</label>
          <select class="form-control" formControlName="requestingDepartmentId">
            <option [ngValue]="null">اختر القسم...</option>
            <option *ngFor="let dept of requestingDepartments" [ngValue]="dept.id">{{ dept.name }}</option>
          </select>
        </div>
        <div class="col-md-6 mb-3 d-none">
          <label class="form-label">المستودع المورد</label>
          <select class="form-control" formControlName="fulfilledByWarehouseId">
            <option [ngValue]="null">اختر المستودع...</option>
            <option *ngFor="let w of warehouses" [ngValue]="w.id">{{ w.name }}</option>
          </select>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label text-primary">المريض المنوم (لخصم التكلفة - إن وجد)</label>
          <select class="form-control" formControlName="admissionId">
            <option [ngValue]="null">بدون مريض (صرف عام للقسم)</option>
            <option *ngFor="let pt of activeAdmissions" [ngValue]="pt.id">{{ pt.displayName }}</option>
          </select>
        </div>
      </div>

      <div>
        <label class="form-label">ملاحظات الطلب</label>
        <textarea class="form-control" formControlName="notes" rows="2"></textarea>
      </div>

      <h5 class="mt-4 border-bottom pb-2">أصناف الطلب</h5>
      <div formArrayName="lines">
        <div class="row align-items-center mb-2" *ngFor="let item of lines.controls; let i=index" [formGroupName]="i">
          <div class="col-6">
            <label class="form-label" *ngIf="i === 0">الصنف</label>
            <ng-template #rt let-r="result" let-t="term">
               <div class="d-flex justify-content-between">
                 <span><ngb-highlight [result]="r.productName" [term]="t"></ngb-highlight></span>
                 <small class="text-muted">({{ r.quantity }})</small>
               </div>
            </ng-template>

            <input
              type="text"
              class="form-control"
              formControlName="selectedItem"
              [ngbTypeahead]="searchItems"
              [inputFormatter]="itemFormatter"
              [resultTemplate]="rt"
              (selectItem)="onSelectItem($event, i)"
              placeholder="ابحث عن صنف..."
            />
            <input type="hidden" formControlName="inventoryItemId" />
          </div>
          <div class="col-4">
            <label class="form-label" *ngIf="i === 0">الكمية المطلوبة</label>
            <input type="number" class="form-control" formControlName="requestedQuantity" />
          </div>
          <div class="col-2">
            <label class="form-label" *ngIf="i === 0">&nbsp;</label>
            <button type="button" class="btn btn-outline-danger btn-sm w-100" (click)="removeLine(i)">
              <i class="fa fa-trash"></i>
            </button>
          </div>
        </div>
      </div>
      
      <button type="button" class="btn btn-outline-primary mt-2 btn-sm" (click)="addLine()">
        <i class="fa fa-plus"></i> إضافة صنف
      </button>

    </form>
  </ng-template>

  <ng-template #abpFooter>
    <button type="button" class="btn btn-secondary" abpClose>
      {{ '::Cancel' | abpLocalization }}
    </button>
    <button class="btn btn-primary" (click)="save()" [disabled]="form?.invalid">
      <i class="fa fa-check me-1"></i>
      {{ '::Save' | abpLocalization }}
    </button>
  </ng-template>
</abp-modal>
