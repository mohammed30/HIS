<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col col-md-6">
        <h5 class="card-title">قائمة أعمال قسم الأشعة</h5>
      </div>
    </div>
  </div>
  <div class="card-body">
    <ngx-datatable [rows]="items.items" [count]="items.totalCount" [list]="list" default>
      <ngx-datatable-column
        [name]="'::Actions' | abpLocalization"
        [maxWidth]="150"
        [sortable]="false"
      >
        <ng-template let-row="row" ngx-datatable-cell-template>
          <button
            class="btn btn-primary btn-sm"
            (click)="edit(row.id)"
            *ngIf="row.status !== statusEnum.Reported"
          >
            <i class="fa fa-edit me-1"></i> إدخال التقرير
          </button>
          <button
            class="btn btn-outline-danger btn-sm"
            (click)="printResult(row.id)"
            *ngIf="row.status === statusEnum.Reported"
          >
            <i class="fa fa-print me-1"></i> طباعة PDF
          </button>
        </ng-template>
      </ngx-datatable-column>

      <ngx-datatable-column name="رقم الطلب" prop="requestNumber"></ngx-datatable-column>
      <ngx-datatable-column name="المريض" prop="patientName"></ngx-datatable-column>
      <ngx-datatable-column name="الفحص المطلوب" prop="radiologyItemName"></ngx-datatable-column>
      <ngx-datatable-column name="تاريخ الطلب" prop="requestDate">
        <ng-template let-value="value" ngx-datatable-cell-template>
          {{ value | date:'short' }}
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column name="الحالة">
        <ng-template let-row="row" ngx-datatable-cell-template>
          <span class="badge" [ngClass]="{
            'bg-secondary': row.status === statusEnum.Requested,
            'bg-info': row.status === statusEnum.UnderProcedure,
            'bg-success': row.status === statusEnum.Reported,
            'bg-danger': row.status === statusEnum.Cancelled
          }">
            {{ getStatusText(row.status) }}
          </span>
        </ng-template>
      </ngx-datatable-column>
    </ngx-datatable>
  </div>
</div>

<!-- Report Modal -->
<abp-modal [(visible)]="isModalOpen" [options]="{ size: 'lg' }">
  <ng-template #abpHeader>
    <h3>تقرير الأشعة: {{ selectedItem.radiologyItemName }}</h3>
    <small class="text-muted">المريض: {{ selectedItem.patientName }}</small>
  </ng-template>

  <ng-template #abpBody>
    <form [formGroup]="form" (ngSubmit)="save()" *ngIf="form">
      <div class="mb-3">
        <label class="form-label fw-bold">حالة الطلب</label>
        <select class="form-select" formControlName="status">
          <option [ngValue]="statusEnum.Requested">مطلوب</option>
          <option [ngValue]="statusEnum.UnderProcedure">قيد التنفيذ</option>
          <option [ngValue]="statusEnum.Reported">تم التقرير</option>
          <option [ngValue]="statusEnum.Cancelled">ملغي</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">ملاحظات الفني</label>
        <textarea class="form-control" formControlName="technicianNotes" rows="2" placeholder="أدخل أي ملاحظات فنيّة هنا..."></textarea>
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">التقرير الطبي (Medical Report)</label>
        <textarea class="form-control" formControlName="reportBody" rows="8" placeholder="اكتب نص التقرير الطبي هنا..."></textarea>
      </div>
    </form>
  </ng-template>

  <ng-template #abpFooter>
    <button type="button" class="btn btn-secondary" abpClose>إغلاق</button>
    <button type="button" class="btn btn-primary" (click)="save()" [disabled]="form?.invalid">
      <i class="fa fa-save me-1"></i> حفظ التقرير
    </button>
  </ng-template>
</abp-modal>
