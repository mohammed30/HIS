<div class="card">
    <div class="card-header">
        <div class="row">
            <div class="col col-md-6">
                <h5 class="card-title">
                    {{ '::PharmacySettings' | abpLocalization }}
                </h5>
            </div>
        </div>
    </div>
    <div class="card-body">
        <form [formGroup]="form" (ngSubmit)="save()">
            <div class="row">
                <div class="col-md-12 mb-3">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="allowNegativeStock" formControlName="allowNegativeStock">
                        <label class="form-check-label" for="allowNegativeStock">
                            {{ '::AllowNegativeStock' | abpLocalization }}
                        </label>
                        <div class="text-muted small">
                            {{ '::AllowNegativeStockDescription' | abpLocalization }}
                        </div>
                    </div>
                </div>
            </div>

            <div class="pt-2">
                <button type="button" class="btn btn-secondary me-2" (click)="loadSettings()" [disabled]="loading">
                    {{ '::Cancel' | abpLocalization }}
                </button>
                <button type="submit" class="btn btn-primary" [disabled]="loading">
                    <i class="fa fa-save me-1"></i> {{ '::Save' | abpLocalization }}
                </button>
            </div>
        </form>
    </div>
</div>
