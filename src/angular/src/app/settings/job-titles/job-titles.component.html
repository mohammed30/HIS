<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="card-title m-0">
            <i class="fa fa-id-badge me-2"></i> Job Titles (المسميات الوظيفية)
        </h5>
        <button class="btn btn-primary" (click)="create()">
            <i class="fa fa-plus me-1"></i> New
        </button>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th>Name (Ar)</th>
                        <th>Name (En)</th>
                        <th>Department</th>
                        <th>Description</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of items">
                        <td>{{ item.nameAr }}</td>
                        <td>{{ item.nameEn }}</td>
                        <td>{{ item.departmentName }}</td>
                        <td>{{ item.description }}</td>
                        <td>
                            <button class="btn btn-sm btn-primary me-1" (click)="edit(item)">
                                <i class="fa fa-pencil"></i>
                            </button>
                            <button class="btn btn-sm btn-danger" (click)="delete(item.id)">
                                <i class="fa fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                    <tr *ngIf="items.length === 0">
                        <td colspan="5" class="text-center">No job titles found.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="d-flex justify-content-between align-items-center mt-3" *ngIf="totalCount > 0">
            <ngb-pagination [(page)]="page" [pageSize]="pageSize" [collectionSize]="totalCount"
                (pageChange)="onPageChange($event)" [maxSize]="5" [boundaryLinks]="true">
            </ngb-pagination>
            <span class="text-muted">Total: {{ totalCount }}</span>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal show d-block" style="background: rgba(0,0,0,0.5)" *ngIf="showForm">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">{{ editingItem ? 'Edit' : 'New' }} Job Title</h5>
                <button type="button" class="btn-close" (click)="showForm = false"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Name (Arabic) *</label>
                    <input type="text" class="form-control" [(ngModel)]="formData.nameAr" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Name (English)</label>
                    <input type="text" class="form-control" [(ngModel)]="formData.nameEn">
                </div>
                <div class="mb-3">
                    <label class="form-label">Department</label>
                    <select class="form-select" [(ngModel)]="formData.departmentId">
                        <option [ngValue]="null">-- Select Department --</option>
                        <option *ngFor="let dept of departments" [value]="dept.id">{{ dept.name }}</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea class="form-control" [(ngModel)]="formData.description"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" (click)="showForm = false">Cancel</button>
                <button type="button" class="btn btn-primary" (click)="save()"
                    [disabled]="!formData.nameAr || isSaving">
                    <i class="fa fa-save me-1"></i> Save
                </button>
            </div>
        </div>
    </div>
</div>
