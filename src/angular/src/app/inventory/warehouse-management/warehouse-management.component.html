<div class="card">
    <div class="card-header">
        <div class="row">
            <div class="col col-md-6">
                <h5 class="card-title">{{ '::Menu:WarehouseManagement' | abpLocalization }}</h5>
            </div>
            <div class="text-end col col-md-6">
                <button id="create" class="btn btn-primary" type="button" (click)="createWarehouse()">
                    <i class="fa fa-plus me-1"></i>
                    <span>{{ '::NewWarehouse' | abpLocalization }}</span>
                </button>
            </div>
        </div>
    </div>
    <div class="card-body">
        <ngx-datatable [rows]="data.items" [count]="data.totalCount" [list]="list" default>
            <ngx-datatable-column [name]="'::Code' | abpLocalization" prop="code" [maxWidth]="150"
                [cellClass]="'text-start'" [headerClass]="'text-start'"></ngx-datatable-column>
            <ngx-datatable-column [name]="'::Name' | abpLocalization" prop="name" [width]="300"
                [cellClass]="'text-start'" [headerClass]="'text-start'"></ngx-datatable-column>
            <ngx-datatable-column [name]="'::Location' | abpLocalization" prop="location" [cellClass]="'text-start'"
                [headerClass]="'text-start'"></ngx-datatable-column>
            <ngx-datatable-column [name]="'::Actions' | abpLocalization" [sortable]="false" [maxWidth]="200"
                [cellClass]="'text-start'" [headerClass]="'text-start'">
                <ng-template let-row="row" ngx-datatable-cell-template>
                    <div class="d-flex gap-2 justify-content-start">
                        <button class="btn btn-warning btn-sm" (click)="openEditModal(row)">
                            <i class="fa fa-pencil"></i> {{ '::Edit' | abpLocalization }}
                        </button>
                        <button class="btn btn-danger btn-sm" (click)="delete(row.id)">
                            <i class="fa fa-trash"></i> {{ '::Delete' | abpLocalization }}
                        </button>
                    </div>
                </ng-template>
            </ngx-datatable-column>
        </ngx-datatable>
    </div>
</div>

<abp-modal [(visible)]="isModalOpen">
    <ng-template #abpHeader>
        <h3>{{ (selectedWarehouse.id ? '::Edit' : '::NewWarehouse') | abpLocalization }}</h3>
    </ng-template>

    <ng-template #abpBody>
        <form [formGroup]="form" (ngSubmit)="save()">
            <div class="form-group">
                <label for="warehouse-name">{{ '::Name' | abpLocalization }}</label><span> * </span>
                <input type="text" id="warehouse-name" class="form-control" formControlName="name" autofocus />
            </div>

            <div class="form-group mt-2">
                <label for="warehouse-location">{{ '::Location' | abpLocalization }}</label>
                <input type="text" id="warehouse-location" class="form-control" formControlName="location" />
            </div>
        </form>
    </ng-template>

    <ng-template #abpFooter>
        <button type="button" class="btn btn-secondary" abpClose>
            {{ '::Cancel' | abpLocalization }}
        </button>
        <button type="button" class="btn btn-primary" (click)="save()" [disabled]="form.invalid">
            <i class="fa fa-check me-1"></i>
            {{ '::Save' | abpLocalization }}
        </button>
    </ng-template>
</abp-modal>
