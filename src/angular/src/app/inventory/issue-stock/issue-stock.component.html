<div class="card">
    <div class="card-header">
        <h5 class="card-title">{{ '::IssueStock' | abpLocalization }}</h5>
    </div>
    <div class="card-body">
        <form [formGroup]="form" (ngSubmit)="save()">
            <div class="row">
                <div class="col-md-6 form-group mb-3">
                    <label>{{ '::Warehouse' | abpLocalization }} *</label>
                    <select class="form-control" formControlName="warehouseId">
                        <option [ngValue]="null">{{ '::SelectWarehouse' | abpLocalization }}</option>
                        <option *ngFor="let w of warehouses" [ngValue]="w.id">{{ w.name }}</option>
                    </select>
                </div>

                <div class="col-md-6 form-group mb-3">
                    <label>{{ '::Department' | abpLocalization }} *</label>
                    <select class="form-control" formControlName="departmentId">
                        <option [ngValue]="null">{{ '::SelectDepartment' | abpLocalization }}</option>
                        <option *ngFor="let d of departments" [ngValue]="d.id">{{ d.nameAr || d.nameEn }}</option>
                    </select>
                </div>

                <div class="col-md-6 form-group mb-3">
                    <label>{{ '::Product' | abpLocalization }} *</label>
                    <select class="form-control" formControlName="productId">
                        <option [ngValue]="null">{{ '::SelectProduct' | abpLocalization }}</option>
                        <option *ngFor="let item of stockItems" [ngValue]="item.productId">
                            {{ item.productName }} (Qty: {{ item.quantity }})
                        </option>
                    </select>
                </div>

                <div class="col-md-6 form-group mb-3">
                    <label>{{ '::ReferenceNumber' | abpLocalization }} *</label>
                    <input type="text" class="form-control" formControlName="referenceNumber"
                        placeholder="Request No / Order No">
                </div>

                <div class="col-md-6 form-group mb-3">
                    <label>{{ '::Quantity' | abpLocalization }} *</label>
                    <input type="number" class="form-control" formControlName="quantity">
                    <div *ngIf="form.get('quantity').errors?.max" class="text-danger small">
                        {{ '::ExceedsAvailableStock' | abpLocalization }}
                    </div>
                </div>

            </div>

            <div class="mt-3">
                <button type="button" class="btn btn-secondary me-2" routerLink="/inventory/dashboard">
                    {{ '::Cancel' | abpLocalization }}
                </button>
                <button type="submit" class="btn btn-primary" [disabled]="form.invalid">
                    <i class="fa fa-save me-1"></i>
                    {{ '::Save' | abpLocalization }}
                </button>
            </div>
        </form>
    </div>
</div>
