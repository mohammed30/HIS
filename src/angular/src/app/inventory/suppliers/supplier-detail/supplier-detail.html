<div class="modal-header">
    <h5 class="modal-title">{{ id ? 'Edit Supplier' : 'New Supplier' }}</h5>
    <button type="button" class="btn-close" aria-label="Close" (click)="dismiss()"></button>
</div>
<div class="modal-body">
    <form [formGroup]="form">
        <div class="mb-3">
            <label class="form-label">Name *</label>
            <input type="text" class="form-control" formControlName="name"
                [class.is-invalid]="form.get('name').invalid && form.get('name').touched">
            <div class="invalid-feedback" *ngIf="form.get('name').errors?.['required']">Name is required.</div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Contact Person</label>
                <input type="text" class="form-control" formControlName="contactPerson">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Phone</label>
                <input type="text" class="form-control" formControlName="phone">
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" formControlName="email">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Tax ID</label>
                <input type="text" class="form-control" formControlName="taxId">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Address</label>
            <textarea class="form-control" formControlName="address" rows="3"></textarea>
        </div>
    </form>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="dismiss()">Cancel</button>
    <button type="button" class="btn btn-primary" (click)="save()" [disabled]="form.invalid || isSaving">
        <i class="fa fa-save me-1"></i> Save
    </button>
</div>
