<div class="card">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h5 class="card-title m-0">
      <i class="fa fa-users me-2"></i> Suppliers (الموردين)
    </h5>
    <button class="btn btn-primary" (click)="create()">
      <i class="fa fa-plus me-1"></i> New Supplier
    </button>
  </div>
  <div class="card-body">
    <!-- Search (Optional for later) -->
    
    <div class="table-responsive">
      <table class="table table-striped table-hover">
        <thead>
          <tr>
            <th>Name</th>
            <th>Contact Person</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Tax ID</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of items">
            <td>{{ item.name }}</td>
            <td>{{ item.contactPerson }}</td>
            <td>{{ item.phone }}</td>
            <td>{{ item.email }}</td>
            <td>{{ item.taxId }}</td>
            <td>
              <button class="btn btn-sm btn-primary me-1" (click)="edit(item.id)">
                <i class="fa fa-pencil"></i>
              </button>
              <button class="btn btn-sm btn-danger" (click)="delete(item.id)">
                <i class="fa fa-trash"></i>
              </button>
            </td>
          </tr>
          <tr *ngIf="items.length === 0">
            <td colspan="6" class="text-center">No suppliers found.</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="d-flex justify-content-between align-items-center mt-3" *ngIf="totalCount > 0">
      <ngb-pagination
        [(page)]="page"
        [pageSize]="pageSize"
        [collectionSize]="totalCount"
        (pageChange)="onPageChange($event)"
        [maxSize]="5"
        [boundaryLinks]="true">
      </ngb-pagination>
      <span class="text-muted">Total: {{ totalCount }}</span>
    </div>
  </div>
</div>
