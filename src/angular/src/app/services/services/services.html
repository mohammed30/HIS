<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <div>
            <h5 class="card-title mb-0">Medical Services Master Data</h5>
            <small class="text-muted">Manage standard billable services</small>
        </div>
        <button class="btn btn-primary" (click)="create()">
            <i class="fa fa-plus me-1"></i> New Service
        </button>
    </div>
    <div class="card-body">
        <ngx-datatable [rows]="items" [count]="totalCount" [list]="list" default>
            <ngx-datatable-column name="Code" prop="code"></ngx-datatable-column>
            <ngx-datatable-column name="Name" prop="name"></ngx-datatable-column>
            <ngx-datatable-column name="Category" prop="category">
                <ng-template let-row="row" let-value="value" ngx-datatable-cell-template>
                    <span class="badge bg-info">{{ value }}</span>
                    <!-- Enum mapping needed in UI or pipe, simple display for now -->
                </ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column name="Active" prop="isActive">
                <ng-template let-value="value" ngx-datatable-cell-template>
                    <span class="badge" [class.bg-success]="value" [class.bg-secondary]="!value">{{ value ? 'Active' :
                        'Inactive' }}</span>
                </ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column name="Actions" sortable="false">
                <ng-template let-row="row" ngx-datatable-cell-template>
                    <button class="btn btn-sm btn-outline-primary me-2" (click)="edit(row.id)">
                        <i class="fa fa-pencil"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-danger" (click)="delete(row.id)">
                        <i class="fa fa-trash"></i>
                    </button>
                </ng-template>
            </ngx-datatable-column>
        </ngx-datatable>
    </div>
</div>

<abp-modal [(visible)]="isModalOpen">
    <ng-template #abpHeader>
        <h3>{{ selectedItem.id ? 'Edit Service' : 'New Service' }}</h3>
    </ng-template>

    <ng-template #abpBody>
        <form [formGroup]="form" (ngSubmit)="save()" *ngIf="form">
            <div class="mb-3">
                <label>Code</label>
                <input type="text" class="form-control" formControlName="code">
            </div>
            <div class="mb-3">
                <label>Name</label>
                <input type="text" class="form-control" formControlName="name">
            </div>
            <div class="mb-3">
                <label>Category</label>
                <select class="form-select" formControlName="category">
                    <option [ngValue]="null">Select Category</option>
                    <option *ngFor="let cat of categories" [ngValue]="cat.key">{{ cat.value }}</option>
                </select>
            </div>
            <div class="form-check">
                <input type="checkbox" class="form-check-input" formControlName="isActive" id="isActive">
                <label class="form-check-label" for="isActive">Is Active</label>
            </div>
        </form>
    </ng-template>

    <ng-template #abpFooter>
        <button type="button" class="btn btn-secondary" abpClose>Cancel</button>
        <button type="button" class="btn btn-primary" (click)="save()" [disabled]="form?.invalid">Save</button>
    </ng-template>
</abp-modal>
