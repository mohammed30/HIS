<div class="card">
    <div class="card-header">
        <div class="row">
            <div class="col col-md-6">
                <h5 class="card-title">
                    {{ '::Menu:Penalties' | abpLocalization }}
                </h5>
            </div>
            <div class="text-end col col-md-6">
                <div class="text-lg-end pt-2">
                    <button id="create-penalty" class="btn btn-primary" type="button" (click)="createPenalty()">
                        <i class="fa fa-plus me-1"></i>
                        <span>{{ '::HR:NewPenalty' | abpLocalization }}</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="card-body">
        <ngx-datatable [rows]="penalties.items" [count]="penalties.totalCount" [list]="list" default>
            <ngx-datatable-column [name]="'::Name' | abpLocalization" prop="employeeName"></ngx-datatable-column>
            <ngx-datatable-column [name]="'::HR:PenaltyType' | abpLocalization" prop="penaltyType">
                <ng-template let-row="row" ngx-datatable-cell-template>
                    {{ '::Enum:PenaltyType:' + row.penaltyType | abpLocalization }}
                </ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column [name]="'::Amount' | abpLocalization" prop="amount"></ngx-datatable-column>
            <ngx-datatable-column [name]="'::HR:SuspensionDays' | abpLocalization"
                prop="suspensionDays"></ngx-datatable-column>
            <ngx-datatable-column [name]="'::Date' | abpLocalization" prop="date">
                <ng-template let-row="row" ngx-datatable-cell-template>{{ row.date | date }}</ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column [name]="'::Actions' | abpLocalization" [maxWidth]="150" [sortable]="false">
                <ng-template let-row="row" ngx-datatable-cell-template>
                    <button class="btn btn-outline-danger btn-sm" (click)="delete(row.id)"
                        [title]="'::Delete' | abpLocalization">
                        <i class="fa fa-trash"></i>
                    </button>
                </ng-template>
            </ngx-datatable-column>
        </ngx-datatable>
    </div>
</div>

<abp-modal [(visible)]="isModalOpen">
    <ng-template #abpHeader>
        <h3>{{ '::HR:NewPenalty' | abpLocalization }}</h3>
    </ng-template>
    <ng-template #abpBody>
        <form [formGroup]="form" (ngSubmit)="save()" validateOnSubmit>
            <div class="mt-2">
                <label for="p-emp">{{ '::Employee' | abpLocalization }} *</label>
                <select class="form-control" id="p-emp" formControlName="employeeId">
                    <option [ngValue]="null">{{ '::Select' | abpLocalization }}</option>
                    <option *ngFor="let emp of employeeLookup" [ngValue]="emp.id">{{ emp.nameAr }} ({{
                        emp.employeeNumber }})</option>
                </select>
            </div>
            <div class="mt-2">
                <label for="p-type">{{ '::HR:PenaltyType' | abpLocalization }} *</label>
                <select class="form-control" id="p-type" formControlName="penaltyType">
                    <option [ngValue]="null">{{ '::Select' | abpLocalization }}</option>
                    <option *ngFor="let opt of typeOptions" [ngValue]="opt.value">
                        {{ '::Enum:PenaltyType:' + opt.value | abpLocalization }}
                    </option>
                </select>
            </div>
            <div class="row">
                <div class="col-md-6" *ngIf="form.get('penaltyType').value === 2">
                    <div class="mt-2">
                        <label for="p-amount">{{ '::Amount' | abpLocalization }}</label>
                        <input type="number" id="p-amount" class="form-control" formControlName="amount" />
                    </div>
                </div>
                <div class="col-md-6" *ngIf="form.get('penaltyType').value === 3">
                    <div class="mt-2">
                        <label for="p-suspension">{{ '::HR:SuspensionDays' | abpLocalization }}</label>
                        <input type="number" id="p-suspension" class="form-control" formControlName="suspensionDays" />
                    </div>
                </div>
            </div>
            <div class="mt-2">
                <label for="p-date">{{ '::Date' | abpLocalization }} *</label>
                <input type="date" id="p-date" class="form-control" formControlName="date" />
            </div>
            <div class="mt-2">
                <label for="p-desc">{{ '::Description' | abpLocalization }}</label>
                <input type="text" id="p-desc" class="form-control" formControlName="description" />
            </div>
            <div class="mt-2">
                <label for="p-notes">{{ '::Notes' | abpLocalization }}</label>
                <textarea id="p-notes" class="form-control" formControlName="notes"></textarea>
            </div>
        </form>
    </ng-template>
    <ng-template #abpFooter>
        <button type="button" class="btn btn-secondary" abpClose>{{ '::Cancel' | abpLocalization }}</button>
        <button class="btn btn-primary" (click)="save()" [disabled]="form.invalid">
            <i class="fa fa-check mr-1"></i>{{ '::Save' | abpLocalization }}
        </button>
    </ng-template>
</abp-modal>
