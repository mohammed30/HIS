<div class="card">
    <div class="card-header">
        <div class="row">
            <div class="col col-md-6">
                <h5 class="card-title">
                    {{ '::Menu:Attendance' | abpLocalization }}
                </h5>
            </div>
            <div class="text-end col col-md-6">
                <div class="text-lg-end pt-2">
                    <button id="create-record" class="btn btn-primary" type="button" (click)="create()">
                        <i class="fa fa-plus me-1"></i>
                        <span>{{ '::HR:NewAttendanceRecord' | abpLocalization }}</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="card-body">
        <ngx-datatable [rows]="records.items" [count]="records.totalCount" [list]="list" default>
            <ngx-datatable-column [name]="'::Name' | abpLocalization" prop="employeeName"></ngx-datatable-column>
            <ngx-datatable-column [name]="'::HR:PermitType' | abpLocalization" prop="permitType">
                <ng-template let-row="row" ngx-datatable-cell-template>
                    {{ (permitTypes | filterById:row.permitType:'name') | abpLocalization }}
                </ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column [name]="'::Date' | abpLocalization" prop="date">
                <ng-template let-row="row" ngx-datatable-cell-template>{{ row.date | date }}</ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column [name]="'::Duration' | abpLocalization">
                <ng-template let-row="row" ngx-datatable-cell-template>
                    {{ row.hours }}h {{ row.minutes }}m
                </ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column [name]="'::HR:Reason' | abpLocalization" prop="reason"></ngx-datatable-column>
            <ngx-datatable-column [name]="'::Actions' | abpLocalization" [maxWidth]="150" [sortable]="false">
                <ng-template let-row="row" ngx-datatable-cell-template>
                    <button class="btn btn-outline-danger btn-sm" (click)="delete(row.id)"
                        [title]="'::Delete' | abpLocalization">
                        <i class="fa fa-trash"></i>
                    </button>
                </ng-template>
            </ngx-datatable-column>
        </ngx-datatable>
    </div>
</div>

<abp-modal [(visible)]="isModalOpen">
    <ng-template #abpHeader>
        <h3>{{ '::HR:NewAttendanceRecord' | abpLocalization }}</h3>
    </ng-template>
    <ng-template #abpBody>
        <form [formGroup]="form" (ngSubmit)="save()" validateOnSubmit>
            <div class="mt-2">
                <label for="att-emp">{{ '::Employee' | abpLocalization }} *</label>
                <select class="form-control" id="att-emp" formControlName="employeeId">
                    <option [ngValue]="null">{{ '::Select' | abpLocalization }}</option>
                    <option *ngFor="let emp of employeeLookup" [ngValue]="emp.id">{{ emp.nameAr }} ({{
                        emp.employeeNumber }})</option>
                </select>
            </div>
            <div class="mt-2">
                <label for="att-type">{{ '::HR:PermitType' | abpLocalization }} *</label>
                <select class="form-control" id="att-type" formControlName="permitType">
                    <option [ngValue]="null">{{ '::Select' | abpLocalization }}</option>
                    <option *ngFor="let pt of permitTypes" [ngValue]="pt.id">{{ pt.name | abpLocalization }}</option>
                </select>
            </div>
            <div class="mt-2">
                <label for="att-date">{{ '::Date' | abpLocalization }} *</label>
                <input type="date" id="att-date" class="form-control" formControlName="date" />
            </div>
            <div class="row">
                <div class="col-md-6">
                    <div class="mt-2">
                        <label for="att-hours">{{ '::Hours' | abpLocalization }}</label>
                        <input type="number" id="att-hours" class="form-control" formControlName="hours" />
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mt-2">
                        <label for="att-minutes">{{ '::Minutes' | abpLocalization }}</label>
                        <input type="number" id="att-minutes" class="form-control" formControlName="minutes" />
                    </div>
                </div>
            </div>
            <div class="mt-2">
                <label for="att-reason">{{ '::HR:Reason' | abpLocalization }}</label>
                <input type="text" id="att-reason" class="form-control" formControlName="reason" />
            </div>
            <div class="mt-2">
                <label for="att-notes">{{ '::Notes' | abpLocalization }}</label>
                <textarea id="att-notes" class="form-control" formControlName="notes"></textarea>
            </div>
        </form>
    </ng-template>
    <ng-template #abpFooter>
        <button type="button" class="btn btn-secondary" abpClose>{{ '::Cancel' | abpLocalization }}</button>
        <button class="btn btn-primary" (click)="save()" [disabled]="form.invalid">
            <i class="fa fa-check mr-1"></i>{{ '::Save' | abpLocalization }}
        </button>
    </ng-template>
</abp-modal>
