<div class="card">
    <div class="card-header">
        <div class="row">
            <div class="col col-md-6">
                <h5 class="card-title">
                    {{ '::Menu:Employees' | abpLocalization }}
                </h5>
            </div>
            <div class="text-end col col-md-6">
                <div class="text-lg-end pt-2">
                    <button id="create" class="btn btn-primary" type="button" (click)="createEmployee()">
                        <i class="fa fa-plus me-1"></i>
                        <span>{{ '::HR:NewEmployee' | abpLocalization }}</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="card-body">
        <ngx-datatable [rows]="employeeList.items" [count]="employeeList.totalCount" [list]="list" default>
            <ngx-datatable-column [name]="'::Code' | abpLocalization" prop="employeeNumber"></ngx-datatable-column>
            <ngx-datatable-column [name]="'::Name' | abpLocalization" prop="nameAr"></ngx-datatable-column>
            <ngx-datatable-column [name]="'::MobileNumber' | abpLocalization" prop="phone"></ngx-datatable-column>
            <ngx-datatable-column [name]="'::HR:JobTitle' | abpLocalization" prop="jobTitleName">
                <ng-template let-row="row" ngx-datatable-cell-template>
                    {{ row.jobTitleName || row.jobTitle }}
                </ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column [name]="'::Status' | abpLocalization" prop="isActive">
                <ng-template let-row="row" ngx-datatable-cell-template>
                    <span *ngIf="row.isActive" class="badge bg-success">{{ '::Active' | abpLocalization }}</span>
                    <span *ngIf="!row.isActive" class="badge bg-danger">{{ '::Inactive' | abpLocalization }}</span>
                </ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column [name]="'::Actions' | abpLocalization" [maxWidth]="150" [sortable]="false">
                <ng-template let-row="row" ngx-datatable-cell-template>
                    <div class="d-flex align-items-center">
                        <button class="btn btn-outline-primary btn-sm me-2" (click)="editEmployee(row.id)"
                            [title]="'::Edit' | abpLocalization">
                            <i class="fa fa-edit"></i>
                        </button>
                        <button class="btn btn-outline-danger btn-sm" (click)="delete(row.id)"
                            [title]="'::Delete' | abpLocalization">
                            <i class="fa fa-trash"></i>
                        </button>
                    </div>
                </ng-template>
            </ngx-datatable-column>
        </ngx-datatable>
    </div>
</div>

<abp-modal [(visible)]="isModalOpen">
    <ng-template #abpHeader>
        <h3>{{ (selectedEmployee.id ? '::Edit' : '::HR:NewEmployee') | abpLocalization }}</h3>
    </ng-template>

    <ng-template #abpBody>
        <form [formGroup]="form" (ngSubmit)="save()" validateOnSubmit>
            <div class="mt-2" *ngIf="selectedEmployee.id">
                <label for="emp-num">{{ '::HR:EmployeeNumber' | abpLocalization }}</label>
                <input type="text" id="emp-num" class="form-control" formControlName="employeeNumber" readonly />
            </div>

            <div class="mt-2" *ngIf="!selectedEmployee.id">
                <label>{{ '::HR:EmployeeNumber' | abpLocalization }}</label>
                <input type="text" class="form-control" placeholder="T-Auto Generated" disabled />
            </div>

            <div class="mt-2">
                <label for="emp-name-ar">{{ '::Name' | abpLocalization }} (Ar) *</label>
                <input type="text" id="emp-name-ar" class="form-control" formControlName="nameAr" />
            </div>

            <div class="mt-2">
                <label for="emp-name-en">{{ '::Name' | abpLocalization }} (En) *</label>
                <input type="text" id="emp-name-en" class="form-control" formControlName="nameEn" />
            </div>

            <div class="row">
                <div class="col-md-6 mt-2">
                    <label for="emp-phone">{{ '::Phone' | abpLocalization }}</label>
                    <input type="text" id="emp-phone" class="form-control" formControlName="phone" />
                </div>
                <div class="col-md-6 mt-2">
                    <label for="emp-email">{{ '::Email' | abpLocalization }}</label>
                    <input type="email" id="emp-email" class="form-control" formControlName="email" />
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mt-2">
                    <label for="emp-id-type">{{ '::HR:IdentityType' | abpLocalization }}</label>
                    <select id="emp-id-type" class="form-control" formControlName="identityType">
                        <option [ngValue]="null">{{ '::Select' | abpLocalization }}</option>
                        <option [ngValue]="1">{{ '::HR:NationalId' | abpLocalization }}</option>
                        <option [ngValue]="2">{{ '::HR:Passport' | abpLocalization }}</option>
                        <option [ngValue]="3">{{ '::HR:ResidencyPermit' | abpLocalization }}</option>
                    </select>
                </div>
                <div class="col-md-6 mt-2">
                    <label for="emp-id-num">{{ '::HR:IdentityNumber' | abpLocalization }}</label>
                    <input type="text" id="emp-id-num" class="form-control" formControlName="identityNumber" />
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mt-2">
                    <label for="emp-title">{{ '::HR:JobTitle' | abpLocalization }}</label>
                    <select id="emp-title" class="form-control" formControlName="jobTitleId">
                        <option [ngValue]="null">{{ '::Select' | abpLocalization }}</option>
                        <option *ngFor="let title of jobTitles" [ngValue]="title.id">{{ title.nameAr }}</option>
                    </select>
                </div>
                <div class="col-md-6 mt-2">
                    <label for="emp-hire">{{ '::HR:HireDate' | abpLocalization }}</label>
                    <input type="date" id="emp-hire" class="form-control" formControlName="hireDate" />
                </div>
            </div>

            <hr />
            <h6>{{ '::HR:FinancialDetails' | abpLocalization }}</h6>
            
            <div class="row">
                <div class="col-md-6 mt-2">
                    <label for="bank-name">{{ '::HR:BankName' | abpLocalization }}</label>
                    <input type="text" id="bank-name" class="form-control" formControlName="bankName" />
                </div>
                <div class="col-md-6 mt-2">
                    <label for="basic-salary">{{ '::HR:BasicSalary' | abpLocalization }}</label>
                    <input type="number" id="basic-salary" class="form-control" formControlName="basicSalary" />
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mt-2">
                    <label for="bank-acc">{{ '::HR:BankAccountNumber' | abpLocalization }}</label>
                    <input type="text" id="bank-acc" class="form-control" formControlName="bankAccountNumber" />
                </div>
                <div class="col-md-6 mt-2">
                    <label for="iban">{{ '::HR:IBAN' | abpLocalization }}</label>
                    <input type="text" id="iban" class="form-control" formControlName="iban" />
                </div>
            </div>

            <div class="mt-3 custom-control custom-switch">
                <input type="checkbox" class="custom-control-input" id="emp-isActive" formControlName="isActive" />
                <label class="custom-control-label ms-2" for="emp-isActive">{{ '::Active' | abpLocalization }}</label>
            </div>
        </form>
    </ng-template>

    <ng-template #abpFooter>
        <button type="button" class="btn btn-secondary" abpClose>
            {{ '::Cancel' | abpLocalization }}
        </button>
        <button class="btn btn-primary" (click)="save()" [disabled]="form.invalid">
            <i class="fa fa-check mr-1"></i>
            {{ '::Save' | abpLocalization }}
        </button>
    </ng-template>
</abp-modal>
