<div class="card">
    <div class="card-header">
        <div class="row">
            <div class="col col-md-6">
                <h5 class="card-title">
                    {{ '::Menu:CompensationItems' | abpLocalization }}
                </h5>
            </div>
            <div class="text-end col col-md-6">
                <div class="text-lg-end pt-2">
                    <button id="create" class="btn btn-primary" type="button" (click)="createItem()">
                        <i class="fa fa-plus me-1"></i>
                        <span>{{ '::HR:NewCompensationItem' | abpLocalization }}</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="card-body">
        <ngx-datatable [rows]="items.items" default>
            <ngx-datatable-column [name]="'::Name' | abpLocalization" prop="nameAr"></ngx-datatable-column>
            <ngx-datatable-column [name]="'::Description' | abpLocalization" prop="displayName"></ngx-datatable-column>
            <ngx-datatable-column [name]="'::Type' | abpLocalization" prop="nature">
                <ng-template let-row="row" ngx-datatable-cell-template>
                    {{ '::Enum:CompensationNature:' + row.nature | abpLocalization }}
                </ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column [name]="'::Status' | abpLocalization" prop="isActive">
                <ng-template let-row="row" ngx-datatable-cell-template>
                    <span *ngIf="row.isActive" class="badge bg-success">{{ '::Available' | abpLocalization }}</span>
                    <span *ngIf="!row.isActive" class="badge bg-danger">{{ '::ClosedHours' | abpLocalization }}</span>
                </ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column [name]="'::Actions' | abpLocalization" [maxWidth]="150" [sortable]="false">
                <ng-template let-row="row" ngx-datatable-cell-template>
                    <div class="d-flex align-items-center">
                        <button class="btn btn-outline-primary btn-sm me-2" (click)="editItem(row.id)"
                            [title]="'::Edit' | abpLocalization">
                            <i class="fa fa-edit"></i>
                        </button>
                        <button class="btn btn-outline-danger btn-sm" (click)="delete(row.id)"
                            [title]="'::Delete' | abpLocalization">
                            <i class="fa fa-trash"></i>
                        </button>
                    </div>
                </ng-template>
            </ngx-datatable-column>
        </ngx-datatable>
    </div>
</div>

<abp-modal [(visible)]="isModalOpen">
    <ng-template #abpHeader>
        <h3>{{ (selectedItem.id ? '::Edit' : '::HR:NewCompensationItem') | abpLocalization }}</h3>
    </ng-template>

    <ng-template #abpBody>
        <form [formGroup]="form" (ngSubmit)="save()" validateOnSubmit>
            <div class="mt-2">
                <label for="item-name-ar">{{ '::Name' | abpLocalization }} *</label>
                <input type="text" id="item-name-ar" class="form-control" formControlName="nameAr" autofocus />
            </div>

            <div class="mt-2">
                <label for="item-display-name">{{ '::Description' | abpLocalization }} *</label>
                <input type="text" id="item-display-name" class="form-control" formControlName="displayName" />
            </div>

            <div class="mt-2">
                <label for="item-nature">{{ '::HR:Nature' | abpLocalization }} *</label>
                <select class="form-control" id="item-nature" formControlName="nature">
                    <option [ngValue]="null">{{ '::Select' | abpLocalization }}</option>
                    <option *ngFor="let option of natureOptions" [ngValue]="option.value">
                        {{ '::Enum:CompensationNature:' + option.value | abpLocalization }}
                    </option>
                </select>
            </div>

            <div class="mt-2" *ngIf="form.get('nature').value">
                <label for="item-value-type">{{ '::HR:ValueType' | abpLocalization }} *</label>
                <select class="form-control" id="item-value-type" formControlName="valueType">
                    <option [ngValue]="null">{{ '::Select' | abpLocalization }}</option>
                    <option *ngFor="let option of valueTypeOptions" [ngValue]="option.value">
                        {{ '::Enum:CompensationValueType:' + option.value | abpLocalization }}
                    </option>
                </select>
            </div>

            <div class="mt-2" *ngIf="form.get('valueType').value === 3">
                <label for="item-formula">{{ '::HR:Formula' | abpLocalization }}</label>
                <input type="text" id="item-formula" class="form-control" formControlName="formulaExpression"
                    placeholder="e.g. Basic * 0.1" />
            </div>

            <div class="mt-2">
                <label for="item-method">{{ '::HR:PaymentMethod' | abpLocalization }} *</label>
                <select class="form-control" id="item-method" formControlName="method">
                    <option [ngValue]="null">{{ '::Select' | abpLocalization }}</option>
                    <option *ngFor="let option of methodOptions" [ngValue]="option.value">
                        {{ '::Enum:CompensationMethod:' + option.value | abpLocalization }}
                    </option>
                </select>
            </div>

            <div class="mt-4 custom-control custom-switch">
                <input type="checkbox" class="custom-control-input" id="item-isActive" formControlName="isActive" />
                <label class="custom-control-label" for="item-isActive">{{ '::Status' | abpLocalization }}</label>
            </div>
        </form>
    </ng-template>

    <ng-template #abpFooter>
        <button type="button" class="btn btn-secondary" abpClose>
            {{ '::Cancel' | abpLocalization }}
        </button>
        <button class="btn btn-primary" (click)="save()" [disabled]="form.invalid">
            <i class="fa fa-check mr-1"></i>
            {{ '::Save' | abpLocalization }}
        </button>
    </ng-template>
</abp-modal>
